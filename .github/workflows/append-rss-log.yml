name: Append RSS report to log
on:
  push:
    paths:
      - 'reports/2026-10-23-rss-*.json'
  workflow_dispatch:
    inputs:
      files:
        description: 'किन JSON के लिए (खाली = आखिरी commit की)'
        required: false
permissions:
  contents: write
jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate changed RSS reports and append log
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -n "${{ github.event.inputs.files }}" ]; then
            files=( ${{ github.event.inputs.files }} )
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before" 2>/dev/null; then
              mapfile -t files < <(git diff --name-only --diff-filter=AM "$before" "${{ github.sha }}" -- 'reports/2026-10-23-rss-*.json')
            else
              files=(reports/2026-10-23-rss-*.json)
            fi
          fi
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            test -f "$f"
            python3 -m json.tool "$f" >/dev/null
            python3 tools/validate.py "$f"
          done
          python3 - "${files[@]}" <<'PY'
          from pathlib import Path
          import json, re, sys
          files=sys.argv[1:]
          p=Path('log.md')
          t=p.read_text(encoding='utf-8')
          for raw in files:
              f=Path(raw)
              d=json.loads(f.read_text(encoding='utf-8'))
              text=re.sub(r'<[^>]+>',' ',d.get('content_html',''))
              wc=len(text.split())
              d['word_count']=wc
              f.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              line=f"- 2026-10-23 | {d['title']} | {f.as_posix()} | {wc}"
              if line not in t:
                  t += ('\n' if not t.endswith('\n') else '') + line + '\n'
          p.write_text(t,encoding='utf-8')
          PY
      - name: Commit log and word counts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DesiLalkaar RSS Reports Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/2026-10-23-rss-*.json log.md
          if git diff --cached --quiet; then echo 'No log changes'; exit 0; fi
          git commit -m 'Update log for RSS report 2026-10-23 [skip ci]'
          git push origin main
