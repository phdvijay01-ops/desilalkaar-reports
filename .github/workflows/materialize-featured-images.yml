name: Materialize Featured Images

on:
  push:
    branches: [main]
    paths:
      - 'reports/images/*.png.b64'
      - '.github/workflows/materialize-featured-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize PNG files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          changed=0
          for src in reports/images/*.png.b64; do
            out="${src%.b64}"
            base64 -d "$src" > "$out"
            python3 - "$out" <<'PY'
import sys, struct
p=sys.argv[1]
with open(p,'rb') as f: sig=f.read(8)
if sig != b'\x89PNG\r\n\x1a\n':
    raise SystemExit(f'Not a valid PNG: {p}')
print(f'validated {p}')
PY
            changed=1
          done
          if [ "$changed" -eq 0 ]; then
            echo "No image payloads found."
          fi

      - name: Commit materialized PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "desilalkaar-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/images/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes to commit."
            exit 0
          fi
          git commit -m "Materialize featured images"
          git push
